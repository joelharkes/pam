plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.10.0'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			// Fixed dev name, so the player (and their progress in the test world) is the same every launch
			programArgs "--username", "Player502"
		}
	}

	mods {
		"progressive_adventure" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Release notes for the current version: its section of CHANGELOG.md ("## 0.4.0 ..." up to the next "## ")
def releaseNotes() {
	def matcher = file("CHANGELOG.md").text =~ /(?ms)^## ${java.util.regex.Pattern.quote(project.version.toString())}\b[^\n]*\n(.*?)(?=^## |\z)/
	if (!matcher.find()) {
		throw new GradleException("CHANGELOG.md has no section for version ${project.version}")
	}
	return matcher.group(1).trim()
}

tasks.register("releaseNotes") {
	description = "Writes this version's CHANGELOG.md section to build/release-notes.md."
	notCompatibleWithConfigurationCache("reads CHANGELOG.md at execution time")
	doLast {
		def out = layout.buildDirectory.file("release-notes.md").get().asFile
		out.parentFile.mkdirs()
		out.text = releaseNotes()
	}
}

// Upload to Modrinth: run by .github/workflows/release.yml when a vX.Y.Z tag is pushed.
// Needs the MODRINTH_TOKEN environment variable. -PmodrinthDebug only prints what would be uploaded.
modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = "hCWGq4lt" // modrinth.com/project/pam-progressive-adventure
	versionNumber = project.version.toString()
	versionName = "PAM ${project.version}"
	versionType = project.release_channel
	changelog = provider { releaseNotes() }
	uploadFile = jar
	gameVersions = [project.minecraft_version]
	loaders = ["fabric"]
	dependencies {
		required.project "fabric-api"
	}
	syncBodyFrom = provider { file("docs/modrinth-description.md").text }
	debugMode = providers.gradleProperty("modrinthDebug").isPresent()
}

tasks.named("modrinth") {
	notCompatibleWithConfigurationCache("Minotaur")
	dependsOn jar
}
