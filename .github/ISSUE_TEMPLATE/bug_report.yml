name: Bug report
description: Something is broken, crashes or behaves strangely.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! The more details, the faster it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen again?
      description: Step by step, if you know.
      placeholder: |
        1. Craft a Waypoint Stone
        2. Right-click it with 1 shard
        3. ...
  - type: input
    id: version
    attributes:
      label: PAM version
      description: Shown in the Mods list, or the jar name.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where were you playing?
      options:
        - Single player
        - LAN
        - Dedicated server
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Any other mods installed besides Fabric API?
  - type: textarea
    id: log
    attributes:
      label: Log or crash report
      description: |
        Drag in `logs/latest.log`, or a file from `crash-reports/`, from your Minecraft folder.
        Or paste the relevant part here.
